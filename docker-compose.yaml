services:
  nest-app:
    build:
      context: .
    image: nest-app
    user: node # uid 1000, keeps dist/ writable on the host
    ports:
      - "3000:3000"
    depends_on:
      db: { condition: service_healthy }
      localstack: { condition: service_started }
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AWS_ENDPOINT_URL_SQS: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  db:
    image: postgres:13
    container_name: ${DATABASE_HOST}
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: localstack/localstack:4.4 # ponytail: last tag usable without LOCALSTACK_AUTH_TOKEN; newer tags (incl. latest/pro) require one
    environment:
      SERVICES: sqs
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    volumes:
      - localstack-data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
volumes:
  postgres-data:
  localstack-data: