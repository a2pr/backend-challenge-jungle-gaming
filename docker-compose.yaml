services:
  nest-app:
    build:
      context: .
    image: nest-app
    user: node # uid 1000, keeps dist/ writable on the host
    ports:
      - "3000:3000"
    depends_on:
      db: { condition: service_healthy }
      localstack: { condition: service_healthy }
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      # .env points at localhost for tests run from the host; inside the compose network the database is the `db` service
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
      AWS_ENDPOINT_URL_SQS: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events
      WORKERS_ENABLED: "true"
      OUTBOX_POLL_MS: "1000"

  db:
    image: postgres:13
    container_name: ${DATABASE_HOST}
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: localstack/localstack:4.4 # ponytail: last tag usable without LOCALSTACK_AUTH_TOKEN; newer tags (incl. latest/pro) require one
    environment:
      SERVICES: sqs
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    volumes:
      - localstack-data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'" ]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  localstack-data: